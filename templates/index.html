{% extends "base.html" %}

{% block content %}
<h2>Upload your resume</h2>
<p>
    We'll pull out the text, identify the skills we recognize, and
    (optionally) compare it against a job description.
</p>

<form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <label for="resume">Resume file (PDF):</label>
    <input type="file" name="resume" id="resume" accept=".pdf" required>

    <label for="job_title">Job title (optional):</label>
    <input type="text" name="job_title" id="job_title" maxlength="100"
           placeholder="e.g. Software Engineer Intern - Summer 2026"
           style="width:100%; padding:6px; border:1px solid #000; margin-bottom:10px;">

    <label for="job_description">Job description (optional):</label>
    <textarea
        name="job_description"
        id="job_description"
        rows="10"
        placeholder="Paste a job description here to see how well your resume matches it."
    ></textarea>

    <button type="submit">Analyze</button>
</form>

{% endblock %}
